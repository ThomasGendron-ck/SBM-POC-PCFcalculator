<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 2cm; }
  body { font-family: "Segoe UI", Arial, sans-serif; color: #1a1a1a; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  h1 { color: #13501B; font-size: 20px; border-bottom: 2px solid #13501B; padding-bottom: 4px; }
  h2 { color: #13501B; font-size: 14px; margin-bottom: 4px; }
  p.pcf { font-size: 16px; }
  .num { text-align: right; }
  table { border-collapse: collapse; width: 100%; margin: 10px 0; }
  th { background: #13501B; color: #fff; padding: 4px 8px; text-align: left; font-size: 12px; }
  td { border-bottom: 1px solid #ddd; padding: 4px 8px; font-size: 12px; }
  ul.flags { color: #C00000; font-size: 12px; }
  p.ok { color: #548235; font-size: 12px; }
</style>
</head>
<body>
{pages}
</body>
</html>
